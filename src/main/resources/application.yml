spring:
  application:
    name: transaction-authorizer
  threads:
    virtual:
      enabled: true
  datasource:
    # Sem defaults de conexão aqui: com env var ausente a aplicação não sobe.
    # (Mecanismo: o Spring não falha placeholder não resolvido; o literal
    # "${DB_URL}" é rejeitado pelo pool por não começar com "jdbc:" e uma
    # credencial literal falha autenticação no banco. Efeito fail-fast igual
    # ao da fila SQS.) Defaults de desenvolvimento: perfil "local" abaixo.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # O pool é o teto de vazão do serviço: com latência média de 3ms, 20
      # conexões dão ~6.7k req/s, o que explica o limite de 7.4k medido em
      # carga. Subir aqui desloca o teto, mas esbarra no max_connections do
      # servidor Postgres — os dois precisam andar juntos.
      #
      # O consumidor SQS divide este mesmo pool: com lote de 10, ele usa até
      # maxConcurrentMessages/10 conexões simultâneas (10 nos padrões atuais).
      # Vale manter (SQS_MAX_CONCURRENT_MESSAGES / 10) + pico HTTP <= pool.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 2000
      # Espera por lock falha rápido, e por um motivo de capacidade: a conexão
      # fica retida enquanto se espera, então uma conta muito disputada (lojista,
      # liquidação) encheria o pool e devolveria 503 para contas que não têm
      # nada a ver com ela. Com 1s, cada requisição barrada solta a conexão três
      # vezes mais rápido que o teto de 3s da transação, que continua valendo
      # para consulta lenta. Também vale para o Flyway: migração que não
      # consegue lock falha o deploy em vez de travá-lo em silêncio.
      connection-init-sql: SET lock_timeout = '1s'
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # A API é JSON-only: sem resolução de multipart, um corpo multipart cai
      # no 415 do handler mapping sem ser parseado (o parsing multipart do Spring
      # escaparia do limite de tamanho da aplicação).
      enabled: false
  cloud:
    aws:
      region:
        static: ${AWS_REGION:sa-east-1}
      # Sem endpoint nem credenciais estáticas aqui: em produção o SDK resolve o
      # endpoint real da AWS e usa a cadeia padrão de credenciais (IAM role).
      # LocalStack só existe no perfil "local" (ver documento abaixo).

authorizer:
  presentation-timezone: ${PRESENTATION_TIMEZONE:America/Sao_Paulo}
  http:
    # Teto de corpo da requisição; o maior payload legítimo tem ~200 bytes.
    max-request-bytes: ${HTTP_MAX_REQUEST_BYTES:16384}
  sqs:
    account-created-queue: ${ACCOUNT_CREATED_QUEUE:conta-bancaria-criada}
    max-concurrent-messages: ${SQS_MAX_CONCURRENT_MESSAGES:100}
    # Destino das mensagens que não têm como ser processadas. O redrive por
    # maxReceiveCount (atributo da fila, provisionado com ela) cobre a falha
    # repetida; esta configuração cobre o outro caso, o da mensagem malformada,
    # que falharia para sempre e por isso é descartada do fluxo na primeira
    # tentativa — a cópia na DLQ é o que a torna auditável (ADR-0005).
    dead-letter-queue: ${ACCOUNT_CREATED_DLQ:conta-bancaria-criada-dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Sem detalhes de infraestrutura para chamadores anônimos; probes e
      # healthchecks só precisam do status agregado.
      show-details: when-authorized
      group:
        # Por padrão o grupo readiness só olha o estado de ciclo de vida do
        # Spring: com o banco fora, o probe continuaria verde e o balanceador
        # seguiria mandando tráfego para uma instância que só sabe responder
        # 503. Readiness é "posso receber tráfego", e sem banco não posso.
        readiness:
          include: readinessState,db
        # Liveness fica só com o estado do processo, de propósito: banco fora é
        # motivo para parar de receber tráfego, não para o orquestrador matar e
        # recriar a instância em laço enquanto a dependência não volta.
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Sem isto, as métricas de latência só expõem contagem, soma e um máximo
      # decadente — dá para calcular média, não percentil. O p99 que o README
      # cita seria impossível de verificar em produção com o que era exposto.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 5ms,25ms,100ms,500ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  shutdown: graceful
  tomcat:
    # Requisição legítima tem ~200 bytes e chega instantaneamente. Com o default
    # de 60s, um cliente que anuncia Content-Length e não envia o corpo prende a
    # conexão (e a thread bloqueada na leitura) por minutos — slow body barato.
    # São timeouts de INATIVIDADE: um cliente que envia bytes lentamente mantém a
    # conexão viva. Limitar a duração total ou exigir taxa mínima é papel do
    # API Gateway/ALB da arquitetura proposta; aqui as threads virtuais tornam
    # uma conexão parada barata (medido: 150 conexões em trickle sem impacto).
    connection-timeout: 10s
    keep-alive-timeout: 15s

---
# Perfil "local": desenvolvimento com LocalStack (docker compose ativa json,local).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # Postgres do docker-compose é exposto no host em 5433 (evita conflito com
    # um Postgres local em 5432); dentro do compose a env DB_URL prevalece.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/authorizer}
    username: ${DB_USERNAME:authorizer}
    password: ${DB_PASSWORD:authorizer}
  cloud:
    aws:
      endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}

authorizer:
  sqs:
    # LocalStack: criar a fila se ainda não existir é conveniência de dev.
    # Fora deste perfil o padrão é FAIL (fila errada = startup falha, ADR-0005).
    queue-not-found-strategy: CREATE
