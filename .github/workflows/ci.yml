name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 'check' roda testes unitários e de integração (Testcontainers usa o
      # Docker do próprio runner). koverVerify falha se cobertura total < 80%.
      - name: Build, testes e gate de cobertura
        run: ./gradlew build koverVerify koverXmlReport koverHtmlReport

      - name: Publica relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/
            build/reports/kover/
          retention-days: 7

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Falha se o score de mutação cair abaixo de 90% (mutationThreshold).
      - name: Testes de mutação (Pitest)
        run: ./gradlew pitest

      - name: Publica relatório de mutação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/reports/pitest/
          retention-days: 7
