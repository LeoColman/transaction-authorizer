name: Smoke

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Sobe a stack completa (LocalStack + gerador + Postgres + app)
        run: docker compose up --build -d

      - name: Aguarda a aplicação ficar saudável
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null; do sleep 3; done'

      - name: Testes de fumaça
        run: ./gradlew smokeTest

      - name: Logs da aplicação (diagnóstico em falha)
        if: failure()
        run: docker compose logs app --tail 100

      - name: Derruba a stack
        if: always()
        run: docker compose down -v
