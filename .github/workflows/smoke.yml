name: Smoke

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Sobe a stack completa (LocalStack + gerador + Postgres + app)
        run: docker compose up --build -d

      - name: Aguarda a aplicação ficar saudável
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null; do sleep 3; done'

      - name: Testes de fumaça
        run: ./gradlew smokeTest

      - name: Logs da aplicação (diagnóstico em falha)
        if: failure()
        run: docker compose logs app --tail 100

      - name: Derruba a stack
        if: always()
        run: docker compose down -v
